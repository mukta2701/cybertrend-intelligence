[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cybertrend"
version = "0.1.0"
description = "Cybersecurity trend intelligence automation for Reddit, CVE feeds, scoring, and SES alerts."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Cybertrend" }]
dependencies = [
  "alembic>=1.13",
  "boto3>=1.34",
  "fastapi>=0.111",
  "feedparser>=6.0",
  "httpx>=0.27",
  "mangum>=0.17",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "psycopg[binary]>=3.2",
  "python-dateutil>=2.9",
  "sqlalchemy>=2.0",
  "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pytest-httpx>=0.30",
  "ruff>=0.5",
  "pyright>=1.1",
  "uvicorn[standard]>=0.30",
]
infra = [
  "aws-cdk-lib>=2.148",
  "constructs>=10.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cybertrend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "infra"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM"]
ignore = ["B008"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
include = ["src"]
exclude = [".venv", "infra", "tests", "alembic", "cdk.out"]
reportMissingTypeStubs = false
